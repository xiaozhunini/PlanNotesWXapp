<!DOCTYPE html><html lang="zh-CN" style="height: 100%; overflow: hidden;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>新建年计划</title>
<!-- Tailwind CSS v3 with Forms and Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          },
          boxShadow: {
            'soft': '0 2px 14px -2px rgba(16, 185, 129, 0.08), 0 1px 4px -1px rgba(0, 0, 0, 0.04)',
            'card': '0 4px 20px -2px rgba(0, 0, 0, 0.03)',
            'btn': '0 6px 18px -2px rgba(16, 185, 129, 0.35)'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-enhancements">
    /* Hide native scrollbar for clean app feel */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      cursor: pointer;
      appearance: none;
      margin-top: -6px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#f1f5f9] text-slate-800 antialiased select-none flex justify-center items-center" style="height: 100%; overflow: hidden; margin: 0; padding: 0;">
<!-- Mobile Viewport Shell (Strict 375px x 812px Locked Container) -->
<div class="bg-[#f8f9ff] flex flex-col shadow-2xl" style="width: 375px; max-width: 375px; min-width: 375px; height: 812px; max-height: 812px; min-height: 812px; overflow: hidden; position: relative; margin: 0 auto; box-sizing: border-box;">
<!-- BEGIN: TopBarAndWeChatHeader -->
<header class="flex-shrink-0 z-30 bg-[#f8f9ff]/95 backdrop-blur-md pt-2 px-4 pb-2 border-b border-slate-100/60">
<!-- iOS Status Bar -->
<div class="flex items-center justify-between text-slate-800 text-xs font-semibold px-2 mb-2">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 16.2L6.77 15.1A6.963 6.963 0 0 1 5 12c0-3.86 3.14-7 7-7s7 3.14 7 7c0 1.2-.31 2.33-.87 3.32L12 19.2z"></path></svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3c3.7 0 7.07 1.43 9.61 3.79L12 18.23 2.39 10.79C4.93 8.43 8.3 7 12 7z"></path></svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</div>
<!-- Mini Program Navigation Bar -->
<div class="flex items-center justify-between h-9 px-1">
<!-- Back Navigation Button -->
<button aria-label="返回" class="w-8 h-8 flex items-center justify-center -ml-1 text-slate-700 active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Centered Title -->
<h1 class="text-[15px] font-bold text-slate-800 tracking-tight">新建年计划</h1>
<!-- WeChat Capsule (Mocked) -->
<div class="flex items-center bg-white/90 border border-slate-200/80 rounded-full px-2.5 py-1 space-x-2 shadow-xs">
<!-- Dots -->
<button aria-label="更多" class="focus:outline-none" type="button">
<svg class="w-3.5 h-3.5 text-slate-700" fill="currentColor" viewBox="0 0 24 24">
<circle cx="5" cy="12" r="2.5"></circle>
<circle cx="12" cy="12" r="2.5"></circle>
<circle cx="19" cy="12" r="2.5"></circle>
</svg>
</button>
<div class="w-[1px] h-3 bg-slate-200"></div>
<!-- Target/Circle -->
<button aria-label="关闭" class="focus:outline-none" type="button">
<svg class="w-3.5 h-3.5 text-slate-700" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="7"></circle>
<circle cx="12" cy="12" fill="currentColor" r="2.5"></circle>
</svg>
</button>
</div>
</div>
</header>
<!-- END: TopBarAndWeChatHeader -->
<!-- BEGIN: FormContent (Only this area scrolls if needed) -->
<main class="flex-1 px-3.5 pt-2.5 pb-2 space-y-2.5 overflow-y-auto">
<!-- Target Year Card Section -->
<section class="bg-white rounded-xl px-3 py-2 shadow-card border border-slate-100/80 flex items-center justify-between" data-purpose="year-selector"><div class="flex items-center space-x-2.5">
<div class="w-7 h-7 rounded-lg bg-emerald-50 flex items-center justify-center text-[#10b981]">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div><div class="flex items-center gap-1.5"><span class="text-xs font-bold text-slate-800">规划年度</span><span class="inline-flex items-center gap-0.5 text-[10px] text-slate-400 font-normal"><svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7l-5 5m0 0l5 5m-5-5h18m-5-5l5 5m0 0l-5 5"></path></svg>滑动</span></div></div>
</div>
<!-- Year Toggle Pills -->
<div class="flex items-center space-x-1.5 overflow-x-auto py-0.5 px-1 bg-slate-100 rounded-lg max-w-[200px] flex-shrink-0" style="scrollbar-width: none;"><button class="px-2.5 py-1 text-xs font-medium rounded-md text-slate-500 hover:text-slate-800 flex-shrink-0 transition-colors" type="button">2023</button><button class="px-2.5 py-1 text-xs font-medium rounded-md text-slate-500 hover:text-slate-800 flex-shrink-0 transition-colors" type="button">2024</button><button class="px-2.5 py-1 text-xs font-semibold rounded-md bg-white text-[#10b981] shadow-xs border border-emerald-100 flex items-center gap-1 flex-shrink-0" type="button"><span class="">2025</span><span class="w-1 h-1 rounded-full bg-[#10b981]"></span></button><button class="px-2.5 py-1 text-xs font-medium rounded-md text-slate-500 hover:text-slate-800 flex-shrink-0 transition-colors" type="button">2026</button><button class="px-2.5 py-1 text-xs font-medium rounded-md text-slate-500 hover:text-slate-800 flex-shrink-0 transition-colors" type="button">2027</button><button class="px-2.5 py-1 text-xs font-medium rounded-md text-slate-500 hover:text-slate-800 flex-shrink-0 transition-colors" type="button">2028</button></div></section>
<!-- Main Form Section -->
<section class="bg-white rounded-xl p-3 shadow-card border border-slate-100/80 space-y-2.5" data-purpose="goal-details-card">
<!-- Field 1: Title -->
<div class="space-y-1">
<div class="flex justify-between items-center text-xs">
<label class="font-bold text-slate-800 flex items-center gap-1" for="goal-title">
目标标题 <span class="text-[#10b981] font-semibold">*</span>
</label>
<span class="text-slate-400 text-[11px]">0/100</span>
</div>
<div class="relative">
<input class="w-full bg-slate-50/80 border-slate-200/80 rounded-xl px-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:bg-white focus:border-[#10b981] focus:ring-1 focus:ring-[#10b981] transition-all outline-none" id="goal-title" placeholder="例如：精通全栈架构 / 半程马拉松完赛" type="text">
</div>
</div>
<!-- Field 2: Tags / Category Selector -->
<div class="space-y-1.5 pt-0.5">
<div class="flex justify-between items-center text-xs">
<label class="font-bold text-slate-800 flex items-center gap-1">
分类标签 <span class="text-slate-400 font-normal text-[11px]">(单选)</span>
</label>
<span class="text-[#10b981] text-[11px] font-medium">+ 管理标签</span>
</div>
<!-- Tags Container -->
<div class="flex flex-wrap gap-1.5 pt-0.5">
<!-- Active Selected Tag -->
<button class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-300 ring-1 ring-emerald-400/20" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-[#10b981]"></span>
技术突破
</button>
<button class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 hover:border-slate-300" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
学习成长
</button>
<button class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 hover:border-slate-300" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
健康运动
</button>
<button class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 hover:border-slate-300" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
财富资产
</button>
<button class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 hover:border-slate-300" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-pink-500"></span>
生活体验
</button>
<button class="inline-flex items-center px-2 py-1 rounded-full text-xs text-slate-400 border border-dashed border-slate-300" type="button">
+ 自定义
</button>
</div>
</div>
<!-- Field 3: Key Results & Description -->
<div class="space-y-1 pt-0.5">
<div class="flex justify-between items-center text-xs">
<label class="font-bold text-slate-800" for="goal-desc">关键结果 / 详细描述</label>
<span class="text-slate-400 text-[11px]">0/500</span>
</div>
<textarea class="w-full bg-slate-50/80 border-slate-200/80 rounded-xl p-2.5 text-xs leading-relaxed text-slate-800 placeholder-slate-400 focus:bg-white focus:border-[#10b981] focus:ring-1 focus:ring-[#10b981] outline-none resize-none" id="goal-desc" placeholder="拆解具体的关键指标与达成路径，例如：
1. 保持每周实战代码输出并撰写沉淀笔记
2. 季度内完成一个独立全栈商业化项目完整上线" rows="3"></textarea>
</div>
</section>
<!-- Advanced / Parameters Card -->
<section class="bg-white rounded-xl p-3 shadow-card border border-slate-100/80 space-y-2.5" data-purpose="goal-parameters-card">
<!-- Field 4: Initial Progress -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="text-xs font-bold text-slate-800" for="progress-slider">初始已完成进度</label>
<span class="text-xs font-bold text-[#10b981] bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">0%</span>
</div>
<div class="pt-0.5">
<input class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#10b981]" id="progress-slider" max="100" min="0" type="range" value="0">
</div>
<div class="flex justify-between text-[10px] text-slate-400 font-medium px-0.5">
<span>0% (新建)</span>
<span>50%</span>
<span>100% (完成)</span>
</div>
</div>
<!-- Field 5: Initial Status -->

</section>
</main>
<!-- END: FormContent -->
<!-- BEGIN: BottomActionBar (Fixed at bottom within 812px height) -->
<footer class="flex-shrink-0 bg-white/95 backdrop-blur-lg border-t border-slate-100 px-4 pt-2.5 pb-4 z-30">
<div class="flex items-center space-x-3">
<!-- Cancel Button -->
<button class="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 active:scale-95 text-slate-700 font-medium text-sm transition-all duration-150" type="button">
取消
</button>
<!-- Save Emerald Button -->
<button class="flex-1 py-2.5 px-4 rounded-xl bg-[#10b981] hover:bg-emerald-600 active:scale-95 text-white font-semibold text-sm shadow-btn transition-all duration-150 flex items-center justify-center space-x-1.5" type="button">
<span>保存</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Home Indicator -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-2"></div>
</footer>
<!-- END: BottomActionBar -->
</div>


</body></html>
